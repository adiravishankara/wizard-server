<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wizard — Card Game</title>
<link rel="stylesheet" href="/static/styles.css">
<script>
(function () {
  var pref = localStorage.getItem("wizard_theme") || "light";
  var resolved = pref === "system"
    ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
    : pref;
  document.documentElement.setAttribute("data-theme", resolved);
  document.documentElement.setAttribute("data-theme-pref", pref);
})();
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">🃏 Wizard</div>
  <div class="topbar-right">
    <nav>
      <button id="nav-games" class="nav-btn active">Games</button>
      <button id="nav-leagues" class="nav-btn">Leagues</button>
    </nav>
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button type="button" id="theme-light" data-theme-pref="light">Light</button>
      <button type="button" id="theme-dark" data-theme-pref="dark">Dark</button>
      <button type="button" id="theme-system" data-theme-pref="system">System</button>
    </div>
  </div>
</header>

<main>
  <!-- ============ GAMES VIEW ============ -->
  <section id="view-games">
    <div id="games-home" class="panel-grid">
      <div class="card panel">
        <h2>New game</h2>
        <label>Your name <input id="new-name" placeholder="e.g. Adi" maxlength="24"></label>
        <label>Bidding
          <select id="new-bidding">
            <option value="sequential">Sequential (normal)</option>
            <option value="simultaneous">Simultaneous (home)</option>
            <option value="secret">Blind / Canadian (bids hidden until end of hand)</option>
            <option value="canadian">Canadian (last bidder can't even the total)</option>
          </select>
        </label>
        <button id="btn-create" class="primary">Create game</button>
      </div>
      <div class="card panel">
        <h2>Join game</h2>
        <label>Game code <input id="join-code" placeholder="8-char code" maxlength="8"></label>
        <label>Your name <input id="join-name" placeholder="e.g. Adi" maxlength="24"></label>
        <button id="btn-join" class="primary">Join game</button>
      </div>
      <div class="card panel">
        <h2>My sessions</h2>
        <div id="sessions-list" class="sessions"></div>
      </div>
    </div>

    <div id="game-screen" class="hidden">
      <div class="game-top">
        <button id="btn-leave" class="ghost">←</button>
        <div class="game-meta">
          <span class="game-code" id="g-code"></span>
          <span id="g-round" class="pill"></span>
          <span id="g-trump" class="trump-chip"></span>
        </div>
      </div>
      <div id="game-alert" class="alert hidden"></div>
      <p id="status-line" class="status-line"></p>

      <div id="lobby-panel" class="card hidden">
        <h2>Lobby</h2>
        <div id="lobby-players" class="player-list"></div>
        <button id="btn-start" class="primary">Start game</button>
        <h3>Teams <span class="hint">(optional)</span></h3>
        <div class="row">
          <select id="league-load"><option value="">Load teams from league…</option></select>
          <button id="btn-league-load" class="ghost">Load</button>
        </div>
        <div id="team-editor"></div>
        <div class="row">
          <input id="new-team-name" placeholder="Team name" maxlength="24">
          <input id="new-team-color" type="color" value="#4f8cff">
          <button id="btn-add-team" class="ghost">Add team</button>
        </div>
        <button id="btn-save-teams" class="primary">Save teams</button>
      </div>

      <div id="table-panel" class="play-stage">
        <div id="opponents" class="badge-row"></div>
        <div id="trick-area" class="trick"></div>
        <div id="you-badge"></div>
      </div>

      <div id="bid-panel" class="bid-sheet hidden">
        <p id="bid-info"></p>
        <div class="bid-controls">
          <button id="bid-minus" class="bid-step" type="button">−</button>
          <span id="bid-value">0</span>
          <button id="bid-plus" class="bid-step" type="button">+</button>
        </div>
        <button id="btn-bid" class="primary bid-go" type="button">Bid</button>
      </div>

      <div id="trump-panel" class="trump-sheet hidden">
        <div id="trump-flip" class="flip-slot"></div>
        <p id="trump-caption" class="trump-caption"></p>
        <div id="trump-actions" class="suit-picker hidden">
          <button data-suit="H" class="suit red" type="button" title="Hearts">♥</button>
          <button data-suit="D" class="suit red" type="button" title="Diamonds">♦</button>
          <button data-suit="C" class="suit" type="button" title="Clubs">♣</button>
          <button data-suit="S" class="suit" type="button" title="Spades">♠</button>
        </div>
        <p id="trump-wait" class="hint hidden"></p>
      </div>

      <div id="hand-panel" class="hand-dock">
        <div id="hand" class="hand"></div>
        <button id="btn-play" class="primary play-confirm hidden" type="button">Play card</button>
      </div>

      <div id="roundover-panel" class="card hidden">
        <h2>Round over</h2>
        <div id="round-scores"></div>
        <button id="btn-ready" class="primary bid-go" type="button">Ready</button>
      </div>

      <div id="gameover-panel" class="card hidden">
        <h2>Game over</h2>
        <div id="final-scores"></div>
        <div id="record-league" class="hidden">
          <div class="row">
            <select id="record-league-select"><option value="">Record to league…</option></select>
            <button id="btn-record" class="primary">Record result</button>
          </div>
        </div>
      </div>

      <aside class="game-side">
        <div class="card">
          <h2>Scores</h2>
          <div id="scores"></div>
        </div>
        <div class="card hidden" id="teams-card">
          <h2>Team scores</h2>
          <div id="team-scores"></div>
        </div>
      </aside>
    </div>
  </section>

  <!-- ============ LEAGUES VIEW ============ -->
  <section id="view-leagues" class="hidden">
    <div id="leagues-home" class="panel-grid">
      <div class="card panel">
        <h2>New league</h2>
        <label>League name <input id="league-name" placeholder="e.g. Friday Night Wizards" maxlength="48"></label>
        <button id="btn-create-league" class="primary">Create league</button>
      </div>
      <div class="card panel wide">
        <h2>Leagues</h2>
        <div id="leagues-list" class="sessions"></div>
      </div>
    </div>

    <div id="league-screen" class="hidden">
      <div class="game-header">
        <button id="btn-league-back" class="ghost">← Leagues</button>
        <h2 id="league-title"></h2>
      </div>
      <div class="tabs">
        <button id="tab-teams" class="tab active">Teams &amp; Rosters</button>
        <button id="tab-standings" class="tab">Standings</button>
        <button id="tab-games" class="tab">Games</button>
      </div>
      <div id="league-tab-teams">
        <div class="panel-grid">
          <div class="card panel">
            <h3>Add player</h3>
            <div class="row">
              <input id="league-player-name" placeholder="Player name" maxlength="24">
              <button id="btn-add-league-player" class="primary">Add</button>
            </div>
            <h3>League players</h3>
            <div id="league-players"></div>
          </div>
          <div class="card panel">
            <h3>Create team</h3>
            <div class="row">
              <input id="league-team-name" placeholder="Team name" maxlength="24">
              <input id="league-team-color" type="color" value="#4f8cff">
              <button id="btn-add-league-team" class="primary">Add team</button>
            </div>
            <div id="league-teams"></div>
          </div>
        </div>
      </div>
      <div id="league-tab-standings" class="hidden">
        <div class="card"><div id="standings-table"></div></div>
      </div>
      <div id="league-tab-games" class="hidden">
        <div class="card"><div id="league-games"></div></div>
      </div>
    </div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
