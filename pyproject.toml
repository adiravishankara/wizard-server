[project]
name = "wizard-server"
version = "0.1.0"
description = "Backend server to power the Wizard card game online"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
client = ["rich", "websockets"]
firebase = ["firebase-admin>=6.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
